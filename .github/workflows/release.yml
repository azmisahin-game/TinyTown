name: release

# Tag-driven release. Pushing a tag like v0.1.0 builds the Windows and Linux
# packages, verifies them, and publishes a GitHub Release with both archives
# attached. The release is only created if both package jobs succeed, so a
# release never appears without real artefacts.
#
# This does not update an installed copy of the application. There is no
# auto-updater: that would need signing, verification and rollback design, and
# is deliberately out of scope.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (for a dry run)'
        required: false
        default: ''

# Least privilege by default. Only the release job gets contents: write.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux package: tar.gz with the binary and the documentation files.
  # ---------------------------------------------------------------------------
  linux-package:
    name: Linux package (tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libsdl2-dev libgl1-mesa-dev zlib1g-dev \
            xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests before packaging
        run: ctest --test-dir build --output-on-failure

      - name: Render a screenshot from the packaged binary (Xvfb)
        # Proves the release binary really renders, not only that it compiles.
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/tinytown --screenshot /tmp/release-smoke.png --screenshot-seconds 5
          test -s /tmp/release-smoke.png
          file /tmp/release-smoke.png

      - name: Build the release tarball
        run: ./tools/package_linux.sh build dist

      - name: Show the packaged file list
        run: tar -tzf dist/*.tar.gz

      - name: Verify the packaged binary runs
        run: |
          tar -xzf dist/*.tar.gz -C /tmp
          /tmp/TinyTown-*/tinytown --help > /dev/null
          /tmp/TinyTown-*/tinytown --help --lang en | head -3
          echo "packaged binary ran successfully"

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows package: zip with the executable and the SDL2 runtime DLL.
  # ---------------------------------------------------------------------------
  windows-package:
    name: Windows package (zip)
    runs-on: windows-2022
    env:
      SDL2_VERSION: "2.32.4"
      SDL2_ROOT: "C:\\SDL2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache SDL2 SDK
        uses: actions/cache@v4
        with:
          path: C:\SDL2
          key: sdl2-${{ env.SDL2_VERSION }}-vc-windows-sdk

      # Same verified install logic as the build workflow. The archive's
      # top-level folder is discovered rather than assumed, and the required
      # files are checked before the SDK is used.
      - name: Verify or install SDL2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version  = $env:SDL2_VERSION
          $sdkRoot  = $env:SDL2_ROOT
          $required = @(
            'cmake\sdl2-config.cmake',
            'cmake\sdl2-config-version.cmake',
            'include\SDL.h',
            'lib\x64\SDL2.lib',
            'lib\x64\SDL2.dll'
          )
          $sources = @(
            "https://www.libsdl.org/release/SDL2-devel-$version-VC.zip",
            "https://github.com/libsdl-org/SDL/releases/download/release-$version/SDL2-devel-$version-VC.zip"
          )

          function Test-SdlSdk {
            param([string]$Root, [string[]]$Files)
            if (-not (Test-Path -LiteralPath $Root -PathType Container)) { return $false }
            foreach ($relative in $Files) {
              $path = Join-Path $Root $relative
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { return $false }
              if ((Get-Item -LiteralPath $path).Length -le 0) { return $false }
            }
            return $true
          }

          if (Test-SdlSdk -Root $sdkRoot -Files $required) {
            Write-Host "SDL2 SDK already present and validated at $sdkRoot"
            exit 0
          }
          if (Test-Path -LiteralPath $sdkRoot) {
            Write-Host "SDL2 SDK at $sdkRoot is incomplete or corrupt; reinstalling."
            Remove-Item -LiteralPath $sdkRoot -Recurse -Force
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "SDL2-devel-$version-VC.zip"
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }

          $downloaded = $false
          $lastError  = $null
          foreach ($url in $sources) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading $url (attempt $attempt of 3)"
                Invoke-WebRequest -Uri $url -OutFile $zipPath -MaximumRedirection 10
                $size = (Get-Item -LiteralPath $zipPath).Length
                if ($size -lt 1MB) { throw "Archive is only $size bytes; expected several MB" }
                Write-Host "Downloaded $zipPath ($size bytes)"
                $downloaded = $true
                break
              } catch {
                $lastError = $_.Exception.Message
                Write-Warning "Attempt $attempt failed for ${url}: $lastError"
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
            if ($downloaded) { break }
            Write-Warning 'Falling back to the next source.'
          }
          if (-not $downloaded) {
            throw "Could not download the SDL2 SDK. Last error: $lastError"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'sdl2-extract'
          if (Test-Path -LiteralPath $extractDir) { Remove-Item -LiteralPath $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force

          $candidateRoots = @(Get-ChildItem -LiteralPath $extractDir -Directory | Select-Object -ExpandProperty FullName)
          $sdkSource = $null
          foreach ($candidate in $candidateRoots) {
            if (Test-Path -LiteralPath (Join-Path $candidate 'cmake\sdl2-config.cmake')) {
              $sdkSource = $candidate
              break
            }
          }
          if (-not $sdkSource) {
            throw "Could not locate the SDL2 SDK root. Candidates: $($candidateRoots -join ', ')"
          }
          Move-Item -LiteralPath $sdkSource -Destination $sdkRoot
          if (-not (Test-SdlSdk -Root $sdkRoot -Files $required)) {
            throw "SDL2 SDK installation at $sdkRoot failed validation."
          }
          Write-Host "SDL2 SDK installed and validated at $sdkRoot"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DSDL2_DIR="$env:SDL2_ROOT\cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests before packaging
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build the release ZIP
        shell: pwsh
        run: |
          .\tools\package_windows.ps1 `
            -BuildDir .\build\Release `
            -OutputDir .\dist `
            -Sdl2Root $env:SDL2_ROOT

      - name: Upload the Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: publish only after both packages exist.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [linux-package, windows-package]
    runs-on: ubuntu-24.04
    # contents: write is granted here and nowhere else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine the version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "error: could not determine the version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Download both packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List the artefacts that will be published
        run: find artifacts -type f | sort

      - name: Confirm both packages are present and non-empty
        run: |
          set -euo pipefail
          count=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          echo "package count: $count"
          if [[ "$count" -ne 2 ]]; then
            echo "error: expected exactly 2 packages, found $count" >&2
            exit 1
          fi
          while IFS= read -r file; do
            if [[ ! -s "$file" ]]; then
              echo "error: package is empty: $file" >&2
              exit 1
            fi
            echo "  $(basename "$file") $(stat -c%s "$file") bytes"
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \))

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: TinyTown v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body_path: docs/RELEASE-NOTES-v0.1.0.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
